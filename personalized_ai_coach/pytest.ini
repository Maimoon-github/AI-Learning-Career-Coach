[pytest]
asyncio_mode = auto

filterwarnings =
    # --- Third-party: crewai internal deprecations (cannot fix in our code) ---
    ignore::DeprecationWarning:crewai.*
    ignore::ImportWarning:importlib.*

    # --- Third-party: asyncio unclosed event loop created by pytest-asyncio ---
    ignore::ResourceWarning:asyncio.*

    # --- SQLAlchemy: ensure our own code stays clean (warn, don't ignore) ---
    # Any MovedIn20Warning from our own src/ is an error so we catch regressions
    error::sqlalchemy.exc.MovedIn20Warning:src.*
