profile_analysis:
  github_analysis:
    description: >
      Analyze the GitHub profile at {github_url} for user {user_id}.
      Extract: primary languages and frameworks, repository count and quality,
      contribution frequency (last 12 months), most complex projects (by LOC and dependencies),
      open-source vs private ratio, code review participation, issue management style.
      Do NOT use stars as a quality signal.
    expected_output: >
      JSON object with keys: languages (dict[str, float] with percentage),
      frameworks (list[str]), contribution_streak (int days), project_complexity_score (0-10),
      key_projects (list[dict] with name/description/tech_stack), collaboration_signals (dict).

  kaggle_analysis:
    description: >
      Analyze the Kaggle profile at {kaggle_url} for user {user_id}.
      Extract: competition performance tier, medal counts, notebook quality and engagement,
      dataset contributions, ML domains covered (NLP, CV, tabular, time-series),
      and recency of activity (last 12 months).
    expected_output: >
      JSON object with keys: tier (Novice/Contributor/Expert/Master/Grandmaster),
      medals (dict), ml_domains (list[str]), notebook_quality_score (0-10),
      active_last_year (bool), strongest_domain (str).

  document_processing:
    description: >
      Process the following documents for user {user_id}: {document_paths}.
      Extract: explicitly stated skills, implicit skills inferred from project descriptions,
      years of experience per domain, education background, career goals if mentioned,
      certifications, and employment history summary.
    expected_output: >
      JSON object with keys: explicit_skills (list[str]), implicit_skills (list[str]),
      experience_years_by_domain (dict[str, float]), certifications (list[str]),
      stated_career_goal (str | null), education_summary (str).

  profile_synthesis:
    description: >
      Synthesize findings from GitHub analysis, Kaggle analysis, and document processing
      into a single unified skill profile. Resolve conflicts by weighting evidence:
      demonstrated code > stated experience > inferred skills.
      Produce a final confidence score per skill.
    expected_output: >
      JSON conforming to SkillProfileModel schema with all fields populated.
      Every skill entry must have: name, level (0-5), source (list), confidence (0-1).

skill_gap:
  role_requirements_extraction:
    description: >
      Search for 10 current job postings for the role "{target_role}" in the tech industry.
      Extract the 20 most commonly required skills, weighting by frequency and seniority alignment.
      Normalize skill names (e.g., "ML" = "Machine Learning"). Filter out soft skills.
    expected_output: >
      JSON list of objects: [{skill: str, frequency: float, weight: float, category: str}]
      sorted by weight descending.

  gap_analysis:
    description: >
      Compare the user skill profile {skill_profile} against role requirements {role_requirements}.
      For each required skill: compute gap severity (0=no gap, 3=critical gap),
      estimated time to close (weeks), learning priority rank, and prerequisite skills.
    expected_output: >
      JSON list of SkillGap objects sorted by priority. Each: skill_name, current_level,
      required_level, gap_severity (1-3), weeks_to_close, prerequisites, learning_objective.

learning_path:
  curriculum_design:
    description: >
      Design a {duration_weeks}-week learning curriculum to close these gaps: {skill_gaps}.
      Available time: {hours_per_week} hours/week.
      Structure as weekly modules. Each module: 1 primary skill + 1 reinforcement topic.
      Enforce dependency ordering (prerequisites first). Apply spaced repetition for reviews.
    expected_output: >
      JSON LearningPath object: weeks list, each week has primary_skill, topics (list),
      estimated_hours, milestone, review_topics.

  resource_curation:
    description: >
      For each topic in the curriculum {curriculum}, find the highest-quality, lowest-cost
      learning resource. Prefer: official docs > university courses > paid courses > blogs.
      For each resource: title, url, type (video/article/course/book), estimated_hours,
      is_free (bool), quality_score (0-10, your assessment).
    expected_output: >
      JSON dict mapping topic_name to list of ResourceEntry objects (max 3 per topic),
      sorted by quality_score descending.

  path_optimization:
    description: >
      Review the draft learning path {draft_path} with resources {resources}.
      Validate: total hours <= {total_available_hours}, no week exceeds {max_weekly_hours}.
      If overloaded: cut lowest-priority resources, consolidate similar topics, extend timeline.
      Apply: interleaving practice with theory, every 4th week = review week.
    expected_output: >
      Final optimized LearningPath JSON with validation_notes and total_hours_per_week per week.

project_generation:
  project_ideation:
    description: >
      Generate 3 project ideas targeting this skill gap: {skill_gap}.
      Current user level: {current_level}. Available time: {available_hours} hours.
      Projects must: produce a deployable or demonstrable artifact, use the target skill as primary,
      be completable in 1-2 weeks, and be meaningfully different from each other in approach.
    expected_output: >
      JSON list of 3 ProjectIdea objects: title, description, primary_skill, secondary_skills,
      estimated_hours, artifact_type (API/notebook/CLI/web-app/model), difficulty (1-5).

  specification_writing:
    description: >
      Write a complete project specification for: {selected_project}.
      Include: problem statement (2 sentences), functional requirements (5-8 bullet points),
      acceptance criteria (measurable), tech stack (specific versions), data sources if needed,
      deliverables checklist, anti-goals (what NOT to build), and a suggested file structure.
    expected_output: >
      Complete ProjectSpec JSON object matching ProjectModel schema.

  difficulty_calibration:
    description: >
      Review project spec {project_spec} for user at skill level {current_level}.
      Adjust scope to ensure: 70% of tasks are within current capability,
      20% are stretch goals, 10% are bonus challenges.
      Remove requirements that require skills 2+ levels above current.
    expected_output: >
      Adjusted ProjectSpec with: calibration_notes (str), removed_requirements (list),
      added_scaffolding (list), stretch_goals (list).

fine_tuning:
  data_preparation:
    description: >
      Process raw user notes: {raw_notes}. For each note:
      1. Clean noise (timestamps, typos, incomplete sentences).
      2. Convert to instruction-following format: {{"instruction": ..., "input": ..., "output": ...}}.
      3. Deduplicate by semantic similarity (threshold 0.9).
      4. Filter examples with output < 20 tokens (too short to learn from).
      Output a JSONL string (one JSON per line).
    expected_output: >
      JSONL string of fine-tuning examples. Also report: total_examples (int),
      filtered_count (int), dedup_removed (int), avg_output_tokens (float).

  fine_tuning_execution:
    description: >
      Initiate fine-tuning on Ollama for model {base_model} using data at {data_path}.
      Parameters: epochs={epochs}, learning_rate={learning_rate}, lora_rank={lora_rank}.
      Monitor training loss every 10 steps. Stop early if loss plateau > 50 steps.
      Report final train loss, estimated overfitting risk.
    expected_output: >
      JSON: model_name (str), final_loss (float), epochs_completed (int),
      early_stopped (bool), estimated_overfitting_risk (low/medium/high), model_path (str).

  model_evaluation:
    description: >
      Evaluate fine-tuned model {fine_tuned_model} vs base model {base_model} on {eval_prompts}.
      Metrics: response_relevance (0-1), personalization_score (0-1), coherence (0-1).
      Run 3 trials per prompt, report mean ± std. Flag any degradation vs base model.
    expected_output: >
      EvaluationReport JSON: per_metric_comparison (dict), overall_improvement (float),
      degraded_prompts (list), recommendation (deploy/retrain/reject).

progress_reporting:
  data_aggregation:
    description: >
      Aggregate learning metrics for user {user_id} for week {week_number}.
      Compute: completion_rate (tasks done / tasks planned), time_spent_hours,
      assessment_scores (list and average), streak_days, skills_practiced (list),
      velocity_trend (vs last 3 weeks), projects_completed.
    expected_output: >
      ProgressMetrics JSON with all computed fields and data_freshness_timestamp.

  report_generation:
    description: >
      Generate a structured weekly progress report for week {week_number} from metrics {metrics}.
      Format: headline_stat (most impressive number), wins (list, max 3),
      focus_area (1 primary skill this week), next_week_plan (3 bullet points),
      time_breakdown (dict). Keep total length under 400 words.
    expected_output: >
      WeeklyReport JSON matching report schema. All fields must be populated.

  motivational_framing:
    description: >
      Add motivational framing to this report: {draft_report} for a user with profile: {user_profile}.
      Apply: growth mindset language, acknowledge specific struggle if completion_rate < 70%,
      highlight genuine progress over absolute metrics.
      DO NOT use: "Amazing!", generic praise, or fabricate achievements.
      Keep addition under 100 words, append as "coach_note" field.
    expected_output: >
      Updated WeeklyReport JSON with coach_note field added. No other modifications.