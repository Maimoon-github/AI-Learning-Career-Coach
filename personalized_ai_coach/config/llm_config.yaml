# Ollama model configuration
primary:
  model: llama3.2:3b
  base_url: "${OLLAMA_BASE_URL}"
  temperature: 0.2
  num_ctx: 8192
  num_predict: 2048
  top_p: 0.9
  repeat_penalty: 1.1

large:
  model: llama3.1:70b
  base_url: "${OLLAMA_BASE_URL}"
  temperature: 0.1
  num_ctx: 32768
  num_predict: 4096
  top_p: 0.85
  repeat_penalty: 1.05

# Used for creative/generative tasks
creative:
  model: llama3.2:3b
  base_url: "${OLLAMA_BASE_URL}"
  temperature: 0.7
  num_ctx: 8192
  num_predict: 2048

# Model routing by task type
routing:
  structured_extraction: primary
  gap_analysis: primary
  curriculum_design: large
  resource_curation: primary
  project_generation: large
  fine_tuning_eval: primary
  report_generation: primary
  motivational_framing: creative